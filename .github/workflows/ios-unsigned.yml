# Builds an unsigned .ipa to install for free from a Mac with Sideloadly.
# No secret needed. Run it from the Actions tab (also works from an iPhone).
# Guide: INSTALL_MAC.md
name: iOS – IPA gratuit (Sideloadly)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Godot + iOS templates
        uses: actions/cache@v5
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}

      - name: Install Godot + export templates
        run: ci/install_godot.sh macos --templates

      - name: Build unsigned IPA
        run: ci/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: MiniPlanete-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
